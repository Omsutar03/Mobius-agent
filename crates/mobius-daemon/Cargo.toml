[package]
name = "mobius-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
mobius-core = { path = "../mobius-core" }
tokio = { version = "1.53.0", features = ["full"] }
tokio-tungstenite = "0.21.0" 
futures-util = "0.3.30"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
