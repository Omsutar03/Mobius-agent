[package]
name = "mobius"
version = "0.1.0"
edition = "2024"

[dependencies]
pico-args = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
html-to-markdown-rs = "3.11.4"
readabilityrs = "0.1.4"
scraper = "0.27.0"
urlencoding = "2.1.3"
